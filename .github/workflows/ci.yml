name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  verify:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate bundled content
        run: python3 tool/validate_content.py

      - name: Generate Android wrapper
        run: |
          flutter create . --platforms=android --org com.deutschgarden
          # `flutter create` scaffolds a counter-app widget test that does not
          # compile against this project. The real widget test is
          # test/app_smoke_test.dart.
          rm -f test/widget_test.dart
          python3 tool/patch_android_manifest.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeutschGarden-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
