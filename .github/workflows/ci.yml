name: CI

# Development happens locally; this workflow is a safety net, not the way
# artifacts normally get built.
#
# Every push runs the cheap correctness gate only. The repository is public,
# so standard hosted-runner minutes are free, but the six-platform matrix still
# takes substantial wall-clock time and stores roughly 800 MB of artifacts.
# Build artifacts on demand instead - from the Actions tab, or by pushing a v*
# tag for a release.
on:
  push:
    # The per-platform branches are gone. They carried nothing but a README
    # banner -- identical code, no artifacts -- and a release page serves the
    # downloads better than five branches that drift out of date.
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_artifacts:
        description: 'Also build the installable artifact for every platform'
        type: boolean
        default: true

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  # Pinned deliberately. Tracking `stable` alone means a Flutter release can
  # turn CI red overnight on a repository nobody pushed to, and makes a build
  # from a v* tag unreproducible six months later. Bump this on purpose.
  FLUTTER_VERSION: 3.47.0

jobs:
  # ---------------------------------------------------------------------
  # One shared correctness gate. The platform builds below only run if the
  # code and the bundled content are sound, so a content typo cannot burn
  # six native/web builds on six runners.
  # ---------------------------------------------------------------------
  verify:
    name: Content, analyze and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Enough history for the commit-message scan below to resolve
          # the pushed range. The default depth of 1 would leave it with
          # only HEAD to look at.
          fetch-depth: 50
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Scans the commit messages in this push, not the diff. A message
      # written with `git commit -m` goes through the shell, and backticks in
      # it are executed -- which is how a session token once reached a public
      # commit body. A message is not reviewed the way a diff is, so this is
      # the only thing that would catch it.
      - name: Check commit messages for leaked environment
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="-1"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$BEFORE..${{ github.sha }}"
          else
            RANGE="-1"
          fi
          echo "scanning $RANGE"
          python tool/check_commit_messages.py "$RANGE"

      - name: Validate bundled content
        run: python tool/validate_content.py

      # Keys present in one locale and missing from another fall back
      # silently; placeholders that disagree throw at runtime, in the
      # locale the author does not use. Both are mechanical.
      - name: Check the translations line up
        run: python tool/check_l10n.py

      # The gloss files are the one place content can go wrong invisibly: a
      # gloss for a card id that no longer exists simply never appears.
      - name: Check the card glosses against the deck
        run: python tool/check_glosses.py

      # The CEFR levels drifted originally because they were set in bulk.
      # The next bulk edit would undo every hand judgement with nothing to
      # notice, so this notices.
      - name: Check the deck against recorded CEFR judgements
        run: python tool/check_relevelling.py

      # The line icons are the only images here the project did not draw,
      # which makes them the only ones with an obligation attached.
      - name: Check the third-party line icons and their licence
        run: python tool/check_line_icons.py

      # The asset policy's first line is that the app stays publishable.
      # Play caps the base module at 200 MB, and the bundle is close enough
      # to that for it to be worth a number rather than a hope.
      - name: Report the bundled asset size
        run: python tool/check_store_size.py

      # "Fully offline" is this project's oldest promise and the easiest to
      # lose by accident: one crash reporter, one convenience fetch, and the
      # README stops being true with nothing failing to say so.
      - name: Check that nothing new reaches the network
        run: python tool/check_network_use.py

      # Every authored item is written answer-first. A new quiz screen that
      # reads .correctIndex off a raw question reintroduces the whole bug and
      # nothing looks wrong.
      - name: Check that multiple choice is shuffled
        run: python tool/check_answer_shuffle.py

      # A hint that names the right option is the answer with extra steps.
      - name: Check that hints do not answer the question
        run: python tool/check_hints.py

      # The emoji tier is generated. A stale entry points at a card that no
      # longer exists and simply never appears -- the silent hole that lost
      # 368 drawings once already.
      - name: Check the generated vocabulary emoji
        run: python tool/check_vocab_emoji.py

      # 1,780 compounds, all generated. A part pointing at a card that no
      # longer exists renders nothing and nobody notices.
      - name: Check the generated compound breakdowns
        run: python tool/check_vocab_compounds.py

      # The only animated grammar in the app, and so the only place a wrong
      # entry teaches a wrong sentence: wiederholen animated as separable
      # teaches "Ich hole wieder".
      - name: Check the separable verbs
        run: python tool/check_separable_verbs.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # ---------------------------------------------------------------------
  # One artifact per platform. Every job builds from the same lib/ — only
  # the generated native wrapper differs.
  #
  # Gated behind workflow_dispatch or a v* tag, see the note on `on:` above.
  # ---------------------------------------------------------------------
  build:
    name: ${{ matrix.label }}
    needs: verify
    # Only on an explicit request or a release tag - never on an ordinary push.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.build_artifacts ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    # Computed here because a step's own `if` can read neither that
    # step's `env` nor `secrets`. Getting this wrong fails silently: the
    # expression is empty, the condition is false, and signing is skipped
    # on a runner that had the certificate all along.
    env:
      APPLE_SIGNING_CONFIGURED: >-
        ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            label: Android APK
            os: ubuntu-latest
            artifact: DeutschGarden-Android-APK
          - target: linux
            label: Linux desktop
            os: ubuntu-latest
            artifact: DeutschGarden-Linux
          - target: windows
            label: Windows desktop
            os: windows-latest
            artifact: DeutschGarden-Windows
          - target: macos
            label: macOS desktop
            os: macos-latest
            artifact: DeutschGarden-macOS
          - target: ios
            label: iOS (unsigned)
            os: macos-latest
            artifact: DeutschGarden-iOS-unsigned
          - target: web
            label: Web (PWA)
            os: ubuntu-latest
            artifact: DeutschGarden-Web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux desktop toolchain
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          # GStreamer is audioplayers_linux's build dependency, and the app
          # needs it because the bundled voice synthesises to a wav that has
          # to be played back. It is a build-time header requirement here and
          # a runtime requirement on the user's machine; every mainstream
          # desktop ships the runtime plugins already, which is why the
          # AppImage does not carry its own copy.
          sudo apt-get install -y ninja-build libgtk-3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate the native wrapper
        shell: bash
        run: |
          flutter create . --platforms=${{ matrix.target }} --org com.deutschgarden
          # `flutter create` scaffolds a counter-app widget test that does not
          # compile against this project. The real one is test/app_smoke_test.dart.
          rm -f test/widget_test.dart
          python tool/patch_platforms.py

      # Reconstruct the Android release key from repository secrets. Without
      # it the Gradle config falls back to debug signing, and a release APK
      # carrying CN=Android Debug is what makes Play Protect warn users that
      # the app is unsafe. The key never lives in the repository.
      - name: Restore the Android signing key
        if: matrix.target == 'android'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE:-}" ]; then
            echo "::warning::No signing key configured; this APK will be"                  "debug-signed and the verification step below will fail."
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > key.properties <<PROPS
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=$RUNNER_TEMP/release.jks
          PROPS
          sed -i 's/^ *//' key.properties

      - name: Resolve dependencies
        run: flutter pub get

      # Must run after `flutter create`, because it writes into the generated
      # native project. Skipped and the app ships Flutter's default icon.
      # One config per platform - see tool/icons/README.md. Linux has none:
      # flutter_launcher_icons does not support it.
      # Only the four targets with a config in tool/icons/. Linux takes its
      # icon from the .desktop file at packaging time, and the web build gets
      # its PWA icons written into web/icons by tool/patch_platforms.py.
      - name: Generate launcher icons
        if: contains('android ios windows macos', matrix.target)
        run: dart run flutter_launcher_icons -f tool/icons/${{ matrix.target }}.yaml

      - name: Build Android APK
        if: matrix.target == 'android'
        run: flutter build apk --release

      # The APK is what someone sideloads; the AAB is the only format
      # Play accepts. Both come from the same signed configuration, so
      # the second costs a few minutes here and removes the step where a
      # release would otherwise be rebuilt by hand before submission.
      - name: Build Android App Bundle
        if: matrix.target == 'android'
        run: flutter build appbundle --release

      - name: Build Linux bundle
        if: matrix.target == 'linux'
        run: flutter build linux --release

      - name: Build Windows bundle
        if: matrix.target == 'windows'
        run: flutter build windows --release

      # An installer rather than a folder: Start-menu entry, clean
      # uninstall, no administrator rights. The zip stays, because an
      # MSIX from an untrusted publisher is harder to run than a folder,
      # not easier, for anyone who just wants to try the app.
      - name: Package Windows MSIX
        if: matrix.target == 'windows'
        run: dart run msix:create --output-path build/msix

      # Apple signing, if and only if it has been configured.
      #
      # Gatekeeper refuses an unsigned app outright on first open; the
      # right-click-Open workaround exists but most people read the
      # dialog as 'this is broken' and stop. Notarising removes it.
      #
      # This needs a paid Apple Developer account, which the project does
      # not have, so the steps are gated on the secrets being present and
      # warn rather than fail when they are not -- exactly as the Android
      # keystore does. A fork with no Apple account still gets a working
      # unsigned build; adding the four secrets is the whole change.
      - name: Import the Apple signing certificate
        if: >-
          matrix.target == 'macos' &&
          env.APPLE_SIGNING_CONFIGURED == 'true'
        env:
          APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASSPHRASE=$(uuidgen)
          echo "$APPLE_CERT" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$PASSPHRASE" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSPHRASE" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$PASSPHRASE" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build macOS app
        if: matrix.target == 'macos'
        run: flutter build macos --release

      - name: Sign and notarise the macOS app
        if: >-
          matrix.target == 'macos' &&
          env.APPLE_SIGNING_CONFIGURED == 'true'
        env:
          APPLE_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 \
                -name '*.app' | head -1)
          # Hardened runtime is a precondition of notarisation.
          codesign --force --deep --options runtime --timestamp \
            --sign "$APPLE_IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          # Staple, so the app opens without contacting Apple.
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Note that the macOS build is unsigned
        if: >-
          matrix.target == 'macos' &&
          env.APPLE_SIGNING_CONFIGURED != 'true'
        run: |
          echo "::warning::No Apple signing certificate is configured,"\
               "so this macOS build is unsigned and Gatekeeper will"\
               "require right-click - Open. See docs/SECURITY_WARNINGS.md."

      - name: Build web bundle
        if: matrix.target == 'web'
        # CanvasKit is pinned to the local copy by tool/patch_platforms.py, so
        # the deployed site fetches nothing from a CDN. Verified below.
        run: flutter build web --release

      - name: Build iOS app (unsigned)
        if: matrix.target == 'ios'
        # No signing certificate in CI, so this produces a .app rather than an
        # installable .ipa. Sideloading it still needs your own signing identity.
        run: flutter build ios --release --no-codesign

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          case "${{ matrix.target }}" in
            android)
              cp build/app/outputs/flutter-apk/app-release.apk \
                 dist/DeutschGarden.apk
              cp build/app/outputs/bundle/release/app-release.aab \
                 dist/DeutschGarden.aab
              ;;
            linux)
              tar -C build/linux/x64/release -czf dist/DeutschGarden-linux-x64.tar.gz bundle
              # AppImage: one file a learner can chmod +x and run on any distro,
              # which is what people actually want from a Linux desktop build.
              mkdir -p AppDir/usr/bin AppDir/usr/share/applications
              mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
              cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
              cp assets/icon/app_icon.png AppDir/deutschgarden.png
              cp assets/icon/app_icon.png \
                 AppDir/usr/share/icons/hicolor/256x256/apps/deutschgarden.png
              printf '%s\n' '[Desktop Entry]' 'Type=Application' \
                'Name=DeutschGarden' 'Comment=Offline German study, A1 to C2' \
                'Exec=deutsch_garden' 'Icon=deutschgarden' \
                'Categories=Education;Languages;' 'Terminal=false' \
                > AppDir/deutschgarden.desktop
              cp AppDir/deutschgarden.desktop \
                 AppDir/usr/share/applications/deutschgarden.desktop
              printf '%s\n' '#!/bin/sh' \
                'HERE=$(dirname "$(readlink -f "$0")")' \
                'exec "$HERE/usr/bin/deutsch_garden" "$@"' > AppDir/AppRun
              chmod +x AppDir/AppRun
              wget -q -O appimagetool \
                https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
              chmod +x appimagetool
              # GitHub runners have no FUSE, hence --appimage-extract-and-run.
              ./appimagetool --appimage-extract-and-run AppDir \
                dist/DeutschGarden-x86_64.AppImage
              ;;
            windows)
              cp build/msix/*.msix dist/DeutschGarden-windows-x64.msix
              powershell -Command "Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'dist/DeutschGarden-windows-x64.zip' -Force"
              ;;
            macos)
              ditto -c -k --sequesterRsrc --keepParent \
                "$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)" \
                dist/DeutschGarden-macos.zip
              ;;
            web)
              # A site that fetches its renderer from Google's CDN is not an
              # offline app. Fail rather than ship that quietly.
              if ! grep -q 'canvasKitBaseUrl' build/web/flutter_bootstrap.js; then
                echo "::error::flutter_bootstrap.js has no canvasKitBaseUrl;" \
                     "the build would load CanvasKit from gstatic.com."
                exit 1
              fi
              tar -C build -czf dist/DeutschGarden-web.tar.gz web
              ;;
            ios)
              ditto -c -k --sequesterRsrc --keepParent \
                build/ios/iphoneos/Runner.app dist/DeutschGarden-ios-unsigned.zip
              # Also package it in .ipa layout. It is UNSIGNED: no GitHub runner
              # holds an Apple signing identity, so this installs only through a
              # tool that re-signs it with your own certificate (Sideloadly,
              # AltStore), or by running `flutter build ipa` on your own Mac.
              # Tapping it will not install it.
              mkdir -p Payload
              cp -R build/ios/iphoneos/Runner.app Payload/
              zip -qry dist/DeutschGarden-ios-unsigned.ipa Payload
              rm -rf Payload
              ;;
          esac
          ls -lh dist

      # A signing regression is invisible until a user is told the app is
      # unsafe, so assert it here instead.
      - name: Verify the APK is not debug-signed
        if: matrix.target == 'android'
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs dist/DeutschGarden.apk)
          echo "$CERTS"
          if echo "$CERTS" | grep -q "CN=Android Debug"; then
            echo "::error::The release APK is signed with the DEBUG key."
            exit 1
          fi

      # apksigner cannot read an AAB, so the bundle is checked with
      # jarsigner instead. Without this it could be debug-signed while
      # the APK beside it is not, and the first anyone would hear of it
      # is a Play Console rejection.
      #
      # The check is jarsigner's exit code plus the certificate name.
      # An earlier version grepped for the words 'jar verified', which
      # failed against a correctly signed bundle: the JDK prints a wall
      # of JarInputStream warnings for AAB entries and its summary
      # wording is not a stable interface.
      - name: Verify the App Bundle is not debug-signed
        if: matrix.target == 'android'
        run: |
          set -uo pipefail
          jarsigner -verify -certs -verbose:summary \
            dist/DeutschGarden.aab > jarsigner.log 2>&1
          STATUS=$?
          grep -E 'certificate DN|jar (verified|is unsigned)' \
            jarsigner.log || true
          if [ "$STATUS" -ne 0 ]; then
            tail -30 jarsigner.log
            echo "::error::jarsigner could not verify the App Bundle."
            exit 1
          fi
          if grep -q 'jar is unsigned' jarsigner.log; then
            echo "::error::The App Bundle carries no signature at all."
            exit 1
          fi
          if grep -q 'CN=Android Debug' jarsigner.log; then
            echo "::error::The App Bundle is signed with the DEBUG key."
            exit 1
          fi
          rm -f jarsigner.log

      - name: Upload ${{ matrix.label }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Publish. Only on a v* tag: a workflow_dispatch build is for checking
  # something, not for cutting a release.
  # ---------------------------------------------------------------------
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Collect every platform artifact
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten and list
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -exec cp -t dist/ {} +
          ls -lh dist

      - name: Extract this version's changelog section
        id: notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Everything between this version's heading and the next one.
          awk -v v="$VERSION" '
            $0 ~ "^## " v "$" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Downloads"
            echo
            # Every file the matrix attaches gets a row. A table that lists
            # five of the ten reads as though the others were not built.
            echo "| Platform | File |"
            echo "| --- | --- |"
            echo "| Android | \`DeutschGarden.apk\` to sideload, \`DeutschGarden.aab\` for Play |"
            echo "| Windows | \`DeutschGarden-windows-x64.msix\` to install, \`DeutschGarden-windows-x64.zip\` to unzip and run |"
            echo "| Linux | \`DeutschGarden-x86_64.AppImage\`, or \`DeutschGarden-linux-x64.tar.gz\` |"
            echo "| macOS | \`DeutschGarden-macos.zip\` |"
            echo "| iOS | \`DeutschGarden-ios-unsigned.ipa\`, or \`DeutschGarden-ios-unsigned.zip\` — **unsigned** |"
            echo "| Web / PWA | \`DeutschGarden-web.tar.gz\` |"
            echo
            echo "The iOS build is unsigned: GitHub runners hold no Apple signing"
            echo "identity. Installing it needs your own certificate via Sideloadly"
            echo "or AltStore, or \`flutter build ipa\` on your own Mac."
            echo
            echo "Everything is offline. No account, no server, no analytics."
          } >> notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A manual recovery may already have created a partial release.
            # Replace its files and notes instead of failing after every
            # platform spent time building successfully.
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "DeutschGarden $GITHUB_REF_NAME" \
              --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "DeutschGarden $GITHUB_REF_NAME" \
              --notes-file notes.md
          fi
