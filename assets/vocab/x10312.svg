<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="personGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="briefcaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8A5A2B"/>
      <stop offset="100%" style="stop-color:#444441"/>
    </linearGradient>
    <linearGradient id="independentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
  </defs>
  <!-- Person being independent -->
  <circle cx="30" cy="25" r="12" fill="url(#personGrad)" stroke="#444441" stroke-width="1"/>
  <circle cx="27" cy="21" r="2" fill="#444441"/>
  <circle cx="33" cy="21" r="2" fill="#444441"/>
  <path d="M27 29 Q30 31 33 29" stroke="#444441" stroke-width="1.5" fill="none"/>
  <!-- Own briefcase/business -->
  <rect x="40" y="30" width="12" height="10" fill="url(#briefcaseGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
  <rect x="42" y="28" width="4" height="2" fill="url(#briefcaseGrad)" stroke="#444441" stroke-width="0.5"/>
  <!-- Independence stars -->
  <path d="M15 15 L17 13 L20 15 L17 17 L15 15" fill="url(#independentGrad)" stroke="#444441" stroke-width="0.5"/>
  <path d="M50 10 L52 8 L55 10 L52 12 L50 10" fill="url(#independentGrad)" stroke="#444441" stroke-width="0.5"/>
  <!-- Freedom lines -->
  <path d="M20 35 Q25 30 30 35" stroke="url(#independentGrad)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M35 35 Q40 30 45 35" stroke="url(#independentGrad)" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>