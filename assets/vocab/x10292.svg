<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="objectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8A5A2B"/>
      <stop offset="100%" style="stop-color:#444441"/>
    </linearGradient>
    <linearGradient id="forceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
  </defs>
  <!-- Influencing hand -->
  <path d="M10 40 Q13 35 17 38 Q21 41 23 35 Q25 29 28 32 Q31 35 33 29 Q35 23 38 26 Q40 20 43 23 Q45 26 44 30 Q43 34 40 37 Q37 40 35 37 Q33 34 30 37 Q27 40 25 37 Q23 34 20 37 Q17 40 15 35 Z" fill="url(#handGrad)" stroke="#8A5A2B" stroke-width="1"/>
  <!-- Object being influenced -->
  <rect x="45" y="25" width="15" height="15" fill="url(#objectGrad)" stroke="#444441" stroke-width="1" rx="2"/>
  <!-- Influence rays -->
  <path d="M38 25 L45 25" stroke="url(#forceGrad)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M38 30 L45 30" stroke="url(#forceGrad)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M38 35 L45 35" stroke="url(#forceGrad)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Movement indicator -->
  <path d="M50 25 L55 20" stroke="#EF9F27" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M50 35 L55 40" stroke="#EF9F27" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Direction arrow -->
  <polygon points="55,30 52,28 52,32" fill="#639922"/>
</svg>