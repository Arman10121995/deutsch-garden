<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
    <linearGradient id="causeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="resultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
  </defs>
  <!-- Cause -->
  <circle cx="15" cy="30" r="8" fill="url(#causeGrad)" stroke="#444441" stroke-width="1"/>
  <!-- Therefore arrow -->
  <path d="M20 30 L45 30 L42 27 M45 30 L42 33" stroke="url(#arrowGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Result -->
  <circle cx="50" cy="30" r="10" fill="url(#resultGrad)" stroke="#444441" stroke-width="1"/>
  <!-- Connection emphasis -->
  <path d="M25 25 L40 25" stroke="url(#arrowGrad)" stroke-width="1.5" fill="none" stroke-dasharray="2,1"/>
  <path d="M25 35 L40 35" stroke="url(#arrowGrad)" stroke-width="1.5" fill="none" stroke-dasharray="2,1"/>
</svg>