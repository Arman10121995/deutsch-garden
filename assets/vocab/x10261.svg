<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="personGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="formGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
  </defs>
  <!-- Person applying -->
  <circle cx="20" cy="25" r="10" fill="url(#personGrad)" stroke="#444441" stroke-width="1"/>
  <circle cx="17" cy="22" r="2" fill="#444441"/>
  <circle cx="23" cy="22" r="2" fill="#444441"/>
  <path d="M17 28 Q20 30 23 28" stroke="#444441" stroke-width="1.5" fill="none"/>
  <!-- Application form -->
  <rect x="35" y="20" width="20" height="25" fill="url(#formGrad)" stroke="#8A5A2B" stroke-width="1" rx="2"/>
  <line x1="40" y1="25" x2="55" y2="25" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="40" y1="30" x2="55" y2="30" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="40" y1="35" x2="55" y2="35" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="40" y1="40" x2="55" y2="40" stroke="#8A5A2B" stroke-width="0.5"/>
  <!-- Submission arrow -->
  <path d="M30 30 L40 30" stroke="#639922" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="40,30 37,28 37,32" fill="#639922"/>
  <!-- Stamp/checkmark -->
  <circle cx="50" cy="48" r="4" fill="#EF9F27" stroke="#8A5A2B" stroke-width="1"/>
  <path d="M48 50 L50 52 L53 49" stroke="#8A5A2B" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>