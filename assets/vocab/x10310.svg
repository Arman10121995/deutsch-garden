<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="personGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="responsibilityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
  </defs>
  <!-- Person being responsible -->
  <circle cx="30" cy="45" r="12" fill="url(#personGrad)" stroke="#444441" stroke-width="1"/>
  <circle cx="27" cy="41" r="2" fill="#444441"/>
  <circle cx="33" cy="41" r="2" fill="#444441"/>
  <path d="M27 49 Q30 51 33 49" stroke="#444441" stroke-width="1.5" fill="none"/>
  <!-- Responsibility badge -->
  <circle cx="30" cy="25" r="8" fill="url(#badgeGrad)" stroke="#8A5A2B" stroke-width="1"/>
  <circle cx="30" cy="25" r="6" fill="none" stroke="#8A5A2B" stroke-width="0.5"/>
  <!-- Badge text indicator -->
  <rect x="26" y="23" width="8" height="4" fill="url(#responsibilityGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
  <!-- Connection to person -->
  <path d="M30 33 L30 40" stroke="#639922" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Responsibility rays -->
  <path d="M25 20 L30 15 L35 20" stroke="url(#responsibilityGrad)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M20 25 L25 25" stroke="url(#responsibilityGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M35 25 L40 25" stroke="url(#responsibilityGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>