<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E24B4A"/>
      <stop offset="100%" style="stop-color:#888780"/>
    </linearGradient>
    <linearGradient id="disappointedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="downGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
  </defs>
  <!-- Disappointed face -->
  <circle cx="32" cy="32" r="15" fill="url(#faceGrad)" stroke="#444441" stroke-width="1"/>
  <!-- Sad eyes -->
  <path d="M25 25 Q27 23 29 25" stroke="#444441" stroke-width="1.5" fill="none"/>
  <path d="M35 25 Q37 23 39 25" stroke="#444441" stroke-width="1.5" fill="none"/>
  <!-- Sad mouth -->
  <path d="M28 40 Q32 45 38 40" stroke="#444441" stroke-width="1.5" fill="none"/>
  <!-- Downward arrow for disappointment -->
  <path d="M32 45 L32 55 L29 52 M32 55 L35 52" stroke="url(#downGrad)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Disappointment emphasis -->
  <circle cx="32" cy="20" r="3" fill="url(#disappointedGrad)" stroke="#444441" stroke-width="0.5"/>
</svg>