<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
    <linearGradient id="realityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="truthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
  </defs>
  <!-- Reality box -->
  <rect x="20" y="25" width="24" height="20" fill="url(#realityGrad)" stroke="#8A5A2B" stroke-width="1" rx="2"/>
  <!-- Large checkmark for actuality -->
  <path d="M28 30 L35 38 L44 28" stroke="url(#checkGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Truth rays -->
  <path d="M30 15 L35 10" stroke="url(#truthGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M40 10 L45 15" stroke="url(#truthGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M35 5 L40 10" stroke="url(#truthGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Fact indicators -->
  <rect x="25" y="20" width="2" height="5" fill="url(#checkGrad)"/>
  <rect x="32" y="20" width="2" height="5" fill="url(#checkGrad)"/>
  <rect x="39" y="20" width="2" height="5" fill="url(#checkGrad)"/>
  <!-- Verification stamp -->
  <circle cx="50" cy="40" r="5" fill="url(#checkGrad)" stroke="#444441" stroke-width="0.5"/>
  <path d="M48 40 L50 42 L53 39" stroke="#444441" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>