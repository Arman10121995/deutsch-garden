<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
    <linearGradient id="supportGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="smallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
  </defs>
  <!-- Main large piece -->
  <rect x="20" y="20" width="24" height="24" fill="url(#mainGrad)" stroke="#444441" stroke-width="1" rx="2"/>
  <!-- Supporting smaller pieces -->
  <rect x="10" y="35" width="8" height="8" fill="url(#supportGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
  <rect x="46" y="35" width="8" height="8" fill="url(#supportGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
  <circle cx="32" cy="10" r="5" fill="url(#smallGrad)" stroke="#444441" stroke-width="0.5"/>
  <circle cx="10" cy="15" r="3" fill="url(#smallGrad)" stroke="#444441" stroke-width="0.5"/>
  <circle cx="54" cy="15" r="3" fill="url(#smallGrad)" stroke="#444441" stroke-width="0.5"/>
  <!-- Main focus indicator -->
  <path d="M25 15 L30 10 L35 15" fill="url(#mainGrad)" stroke="#444441" stroke-width="0.5"/>
  <!-- Connection lines -->
  <path d="M20 30 L18 33" stroke="url(#mainGrad)" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M44 30 L46 33" stroke="url(#mainGrad)" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M30 20 L30 15" stroke="url(#mainGrad)" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M34 20 L34 15" stroke="url(#mainGrad)" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- Main label -->
  <rect x="25" y="35" width="14" height="4" fill="url(#mainGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
</svg>