<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="growGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
  </defs>
  <!-- Growing arrow pointing right -->
  <path d="M10 30 L20 30 L17 27 M20 30 L17 33" stroke="url(#growGrad)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M20 30 L30 30 L27 27 M30 30 L27 33" stroke="url(#growGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30 30 L40 30 L37 27 M40 30 L37 33" stroke="url(#growGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Up arrow for increase -->
  <path d="M58 20 L58 15 L61 15 L58 12 L55 15 L58 15 L58 20" stroke="#639922" stroke-width="1.5" fill="#639922" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bars showing increase -->
  <rect x="12" y="45" width="4" height="10" fill="url(#barGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
  <rect x="22" y="40" width="4" height="15" fill="url(#barGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
  <rect x="32" y="35" width="4" height="20" fill="url(#barGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
  <rect x="42" y="30" width="4" height="25" fill="url(#barGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
  <rect x="52" y="20" width="4" height="35" fill="url(#barGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
</svg>