<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="personGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="adaptationGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
    <linearGradient id="environmentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
  </defs>
  <!-- Person getting used to -->
  <circle cx="20" cy="40" r="12" fill="url(#personGrad)" stroke="#444441" stroke-width="1"/>
  <circle cx="17" cy="36" r="2" fill="#444441"/>
  <circle cx="23" cy="36" r="2" fill="#444441"/>
  <path d="M17 44 Q20 46 23 44" stroke="#444441" stroke-width="1.5" fill="none"/>
  <!-- New environment -->
  <rect x="40" y="20" width="20" height="30" fill="url(#environmentGrad)" stroke="#8A5A2B" stroke-width="1" rx="2"/>
  <circle cx="45" cy="25" r="3" fill="#8A5A2B"/>
  <circle cx="50" cy="30" r="2" fill="#8A5A2B"/>
  <circle cx="55" cy="35" r="3" fill="#8A5A2B"/>
  <!-- Adaptation process -->
  <path d="M30 35 L38 30" stroke="url(#adaptationGrad)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="38,30 35,28 35,32" fill="url(#adaptationGrad)"/>
  <!-- Comfort indicator -->
  <path d="M25 25 Q30 20 35 25" stroke="#639922" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Steps of adaptation -->
  <circle cx="35" cy="25" r="2" fill="#EF9F27"/>
  <circle cx="38" cy="28" r="1.5" fill="#EF9F27"/>
  <circle cx="41" cy="31" r="1" fill="#EF9F27"/>
</svg>