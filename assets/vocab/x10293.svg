  <!-- Person being respected -->
  <circle cx="45" cy="25" r="12" fill="url(#personGrad2)" stroke="#444441" stroke-width="1"/>
  <circle cx="42" cy="21" r="2" fill="#444441"/>
  <circle cx="48" cy="21" r="2" fill="#444441"/>
  <path d="M42 29 Q45 31 48 29" stroke="#444441" stroke-width="1.5" fill="none"/>
  <!-- Respect crown/halo -->
  <path d="M40 15 Q42 10 45 15 Q48 10 50 15" fill="url(#respectGrad)" stroke="#444441" stroke-width="0.5"/>
  <circle cx="45" cy="12" r="2" fill="url(#respectGrad)" stroke="#444441" stroke-width="0.5"/>
  <!-- Respect connection -->
  <path d="M30 35 L38 30" stroke="url(#respectGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
