  <!-- Usual pattern -->
  <circle cx="15" cy="15" r="3" fill="url(#usualGrad)" stroke="#444441" stroke-width="0.5"/>
  <circle cx="50" cy="15" r="3" fill="url(#usualGrad)" stroke="#444441" stroke-width="0.5"/>
  <circle cx="15" cy="50" r="3" fill="url(#usualGrad)" stroke="#444441" stroke-width="0.5"/>
  <circle cx="50" cy="50" r="3" fill="url(#usualGrad)" stroke="#444441" stroke-width="0.5"/>
</svg>