<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="calendarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="personGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
  </defs>
  <!-- Calendar -->
  <rect x="10" y="10" width="44" height="40" fill="url(#calendarGrad)" stroke="#8A5A2B" stroke-width="1" rx="2"/>
  <!-- Calendar grid -->
  <line x1="15" y1="15" x2="54" y2="15" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="15" y1="25" x2="54" y2="25" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="15" y1="35" x2="54" y2="35" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="15" y1="45" x2="54" y2="45" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="25" y1="10" x2="25" y2="50" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="35" y1="10" x2="35" y2="50" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="45" y1="10" x2="45" y2="50" stroke="#8A5A2B" stroke-width="0.5"/>
  <!-- Checkmarks for organized items -->
  <path d="M20 20 L24 24 L28 20" stroke="#639922" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M35 20 L39 24 L43 20" stroke="#639922" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M45 28 L49 32 L53 28" stroke="#639922" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M20 38 L24 42 L28 38" stroke="#639922" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M35 40 L39 44 L43 40" stroke="#639922" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Person organizing -->
  <circle cx="50" cy="55" r="6" fill="url(#personGrad)" stroke="#444441" stroke-width="1"/>
  <circle cx="47" cy="53" r="1.5" fill="#444441"/>
  <circle cx="53" cy="53" r="1.5" fill="#444441"/>
</svg>