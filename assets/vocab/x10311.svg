<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="trophyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
  </defs>
  <!-- Trophy cup -->
  <path d="M25 45 L28 25 L30 20 L38 20 L40 25 L43 45 L40 45 L40 50 L35 50 L35 45 L32 45 L32 50 L27 50 L27 45 Z" fill="url(#trophyGrad)" stroke="#8A5A2B" stroke-width="1"/>
  <!-- Trophy base -->
  <rect x="28" y="50" width="18" height="6" fill="url(#trophyGrad)" stroke="#8A5A2B" stroke-width="1" rx="1"/>
  <!-- Star on top -->
  <path d="M30 15 L32 12 L35 15 L32 18 L30 15" fill="url(#starGrad)" stroke="#444441" stroke-width="0.5"/>
  <!-- Success rays -->
  <path d="M30 20 L25 15" stroke="url(#successGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M40 20 L45 15" stroke="url(#successGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M35 10 L35 15" stroke="url(#successGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Winning checkmarks -->
  <path d="M20 35 L24 38 L28 35" stroke="url(#successGrad)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 35 L44 38 L48 35" stroke="url(#successGrad)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>