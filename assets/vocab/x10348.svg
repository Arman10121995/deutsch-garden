<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E24B4A"/>
      <stop offset="100%" style="stop-color:#888780"/>
    </linearGradient>
    <linearGradient id="sweatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="embarrassingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
  </defs>
  <!-- Embarrassed face -->
  <circle cx="32" cy="32" r="15" fill="url(#faceGrad)" stroke="#444441" stroke-width="1"/>
  <!-- Embarrassed eyes -->
  <path d="M25 25 Q27 27 29 25" stroke="#444441" stroke-width="1.5" fill="none"/>
  <path d="M35 25 Q37 27 39 25" stroke="#444441" stroke-width="1.5" fill="none"/>
  <!-- Embarrassed mouth -->
  <path d="M28 40 Q32 42 38 40" stroke="#444441" stroke-width="1.5" fill="none"/>
  <!-- Sweat drops -->
  <circle cx="20" cy="20" r="2" fill="url(#sweatGrad)" stroke="#444441" stroke-width="0.5"/>
  <circle cx="45" cy="20" r="2" fill="url(#sweatGrad)" stroke="#444441" stroke-width="0.5"/>
  <circle cx="35" cy="15" r="1.5" fill="url(#sweatGrad)" stroke="#444441" stroke-width="0.5"/>
  <!-- Blush -->
  <circle cx="20" cy="30" r="3" fill="url(#embarrassingGrad)" stroke="#444441" stroke-width="0.5" opacity="0.7"/>
  <circle cx="45" cy="30" r="3" fill="url(#embarrassingGrad)" stroke="#444441" stroke-width="0.5" opacity="0.7"/>
</svg>