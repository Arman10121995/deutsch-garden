<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="plusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
    <linearGradient id="additionalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
  </defs>
  <!-- Base items -->
  <circle cx="20" cy="30" r="8" fill="url(#baseGrad)" stroke="#444441" stroke-width="1"/>
  <rect x="35" y="25" width="8" height="10" fill="url(#baseGrad)" stroke="#444441" stroke-width="1" rx="1"/>
  <!-- Plus sign for addition -->
  <rect x="28" y="25" width="8" height="2" fill="url(#plusGrad)" stroke="#444441" stroke-width="0.5"/>
  <rect x="31" y="22" width="2" height="6" fill="url(#plusGrad)" stroke="#444441" stroke-width="0.5"/>
  <!-- Additional items -->
  <circle cx="50" cy="20" r="6" fill="url(#additionalGrad)" stroke="#444441" stroke-width="0.5"/>
  <path d="M45 40 L50 45 L55 40 L50 35 L45 40" fill="url(#additionalGrad)" stroke="#444441" stroke-width="0.5"/>
  <!-- Connection lines -->
  <path d="M26 30 L34 30" stroke="url(#plusGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M40 30 L48 25" stroke="url(#plusGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M40 30 L48 40" stroke="url(#plusGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>