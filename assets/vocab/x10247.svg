<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="personGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="obstacleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E24B4A"/>
      <stop offset="100%" style="stop-color:#888780"/>
    </linearGradient>
  </defs>
  <!-- Person avoiding (stepping back) -->
  <circle cx="20" cy="35" r="12" fill="url(#personGrad)" stroke="#444441" stroke-width="1"/>
  <circle cx="17" cy="30" r="2" fill="#444441"/>
  <circle cx="23" cy="30" r="2" fill="#444441"/>
  <path d="M17 37 Q20 40 23 37" stroke="#444441" stroke-width="1.5" fill="none"/>
  <!-- Obstacle to avoid -->
  <rect x="40" y="25" width="14" height="24" fill="url(#obstacleGrad)" stroke="#E24B4A" stroke-width="1" rx="2"/>
  <!-- Avoidance motion lines -->
  <path d="M28 25 Q35 20 40 25" stroke="#E24B4A" stroke-width="1" fill="none" stroke-dasharray="2,1"/>
  <path d="M28 45 Q35 50 40 45" stroke="#E24B4A" stroke-width="1" fill="none" stroke-dasharray="2,1"/>
</svg>