<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="pleasantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
  </defs>
  <!-- Sun -->
  <circle cx="32" cy="20" r="8" fill="url(#sunGrad)" stroke="#8A5A2B" stroke-width="0.5"/>
  <!-- Sun rays -->
  <path d="M32 12 L32 5" stroke="url(#pleasantGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M32 28 L32 35" stroke="url(#pleasantGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M24 20 L17 20" stroke="url(#pleasantGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M40 20 L47 20" stroke="url(#pleasantGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M26 16 L19 13" stroke="url(#pleasantGrad)" stroke-width="1" stroke-linecap="round"/>
  <path d="M38 16 L45 13" stroke="url(#pleasantGrad)" stroke-width="1" stroke-linecap="round"/>
  <path d="M26 24 L19 27" stroke="url(#pleasantGrad)" stroke-width="1" stroke-linecap="round"/>
  <path d="M38 24 L45 27" stroke="url(#pleasantGrad)" stroke-width="1" stroke-linecap="round"/>
  <!-- Smiling eyes -->
  <path d="M25 25 Q27 23 29 25" stroke="#444441" stroke-width="1.5" fill="none"/>
  <path d="M35 25 Q37 23 39 25" stroke="#444441" stroke-width="1.5" fill="none"/>
  <!-- Smile -->
  <path d="M28 30 Q32 35 38 30" stroke="#444441" stroke-width="1.5" fill="none"/>
  <!-- Sky background -->
  <rect x="10" y="40" width="44" height="10" fill="url(#skyGrad)" stroke="#444441" stroke-width="0.5"/>
</svg>