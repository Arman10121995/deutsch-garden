<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8A5A2B"/>
      <stop offset="100%" style="stop-color:#444441"/>
    </linearGradient>
  </defs>
  <!-- Document to sign -->
  <rect x="30" y="25" width="25" height="30" fill="url(#docGrad)" stroke="#8A5A2B" stroke-width="1" rx="2"/>
  <line x1="33" y1="30" x2="55" y2="30" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="33" y1="35" x2="55" y2="35" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="33" y1="40" x2="55" y2="40" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="33" y1="45" x2="55" y2="45" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="33" y1="50" x2="55" y2="50" stroke="#8A5A2B" stroke-width="0.5"/>
  <!-- Signing hand -->
  <path d="M10 40 Q13 35 17 38 Q21 41 23 35 Q25 29 28 32 Q31 35 33 29 Q35 23 38 26 Q40 20 43 23 Q45 26 44 30 Q43 34 40 37 Q37 40 35 37 Q33 34 30 37 Q27 40 25 37 Q23 34 20 37 Q17 40 15 35 Z" fill="url(#handGrad)" stroke="#8A5A2B" stroke-width="1"/>
  <!-- Pen signing -->
  <path d="M28 18 Q30 15 33 18 Q36 21 33 23" fill="url(#penGrad)" stroke="#444441" stroke-width="0.5"/>
  <path d="M33 18 L45 25" stroke="#444441" stroke-width="1" fill="none"/>
  <rect x="30" y="20" width="5" height="1" fill="#444441"/>
  <!-- Signature line -->
  <path d="M40 45 Q45 40 50 45 Q55 50 50 55" stroke="#8A5A2B" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Signature indicator -->
  <path d="M38 48 L42 45 L45 48" stroke="#639922" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>