<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="personGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="protectionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
  </defs>
  <!-- Person being protected -->
  <circle cx="30" cy="40" r="10" fill="url(#personGrad)" stroke="#444441" stroke-width="1"/>
  <circle cx="27" cy="36" r="1.5" fill="#444441"/>
  <circle cx="33" cy="36" r="1.5" fill="#444441"/>
  <path d="M27 44 Q30 46 33 44" stroke="#444441" stroke-width="1" fill="none"/>
  <!-- Shield of protection -->
  <path d="M15 20 Q20 10 35 10 Q50 10 55 20 Q55 50 35 60 Q15 50 15 20" fill="url(#shieldGrad)" stroke="#444441" stroke-width="1"/>
  <!-- Protection rays -->
  <path d="M25 15 L35 15" stroke="url(#protectionGrad)" stroke-width="1.5" fill="none" stroke-dasharray="2,1"/>
  <path d="M30 20 L35 15" stroke="url(#protectionGrad)" stroke-width="1.5" fill="none" stroke-dasharray="2,1"/>
  <path d="M35 15 L40 20" stroke="url(#protectionGrad)" stroke-width="1.5" fill="none" stroke-dasharray="2,1"/>
  <!-- Safe zone -->
  <circle cx="35" cy="35" r="12" fill="none" stroke="#444441" stroke-width="0.5" stroke-dasharray="2,1"/>
  <!-- Checkmark for safety -->
  <path d="M32 30 L36 34 L40 30" stroke="#639922" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>