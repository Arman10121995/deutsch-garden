  <rect x="35" y="20" width="22" height="30" fill="url(#checklistGrad)" stroke="#8A5A2B" stroke-width="1" rx="2"/>
  <line x1="38" y1="25" x2="57" y2="25" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="38" y1="32" x2="57" y2="32" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="38" y1="39" x2="57" y2="39" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="38" y1="46" x2="57" y2="46" stroke="#8A5A2B" stroke-width="0.5"/>
  <!-- Judge's gavel -->
