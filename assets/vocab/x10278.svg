  <rect x="50" y="18" width="4" height="15" fill="url(#judgeGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
  <!-- Assessment marks -->
  <path d="M40 28 L44 32 L48 28" stroke="#639922" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 35 L44 39 L48 35" stroke="#639922" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 42 L44 46 L48 42" stroke="#E24B4A" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
