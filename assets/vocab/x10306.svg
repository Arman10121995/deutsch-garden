<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="circleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="circleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="circleGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
    <linearGradient id="diffGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E24B4A"/>
      <stop offset="100%" style="stop-color:#888780"/>
    </linearGradient>
  </defs>
  <!-- Different colored circles -->
  <circle cx="20" cy="20" r="8" fill="url(#circleGrad1)" stroke="#444441" stroke-width="1"/>
  <circle cx="40" cy="25" r="10" fill="url(#circleGrad2)" stroke="#444441" stroke-width="1"/>
  <circle cx="15" cy="45" r="6" fill="url(#circleGrad3)" stroke="#444441" stroke-width="1"/>
  <!-- Difference indicators -->
  <path d="M30 15 L35 20" stroke="url(#diffGrad)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="35,20 32,18 32,22" fill="url(#diffGrad)"/>
  <!-- Connecting lines with X -->
  <path d="M28 20 L38 25" stroke="#444441" stroke-width="1" fill="none"/>
  <path d="M32 28 L28 32 M36 28 L32 32" stroke="#E24B4A" stroke-width="1" stroke-linecap="round"/>
  <!-- Size difference -->
  <rect x="25" y="30" width="2" height="4" fill="url(#diffGrad)"/>
  <rect x="35" y="33" width="2" height="6" fill="url(#diffGrad)"/>
  <rect x="10" y="35" width="2" height="3" fill="url(#diffGrad)"/>
</svg>