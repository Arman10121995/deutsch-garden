<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="personGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="backpackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8A5A2B"/>
      <stop offset="100%" style="stop-color:#444441"/>
    </linearGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
  </defs>
  <!-- Person preparing -->
  <circle cx="20" cy="30" r="12" fill="url(#personGrad)" stroke="#444441" stroke-width="1"/>
  <circle cx="17" cy="26" r="2" fill="#444441"/>
  <circle cx="23" cy="26" r="2" fill="#444441"/>
  <path d="M17 34 Q20 36 23 34" stroke="#444441" stroke-width="1.5" fill="none"/>
  <!-- Backpack with preparation gear -->
  <path d="M30 20 Q35 15 45 20 Q45 40 35 45 Q30 40 30 20" fill="url(#backpackGrad)" stroke="#444441" stroke-width="1"/>
  <rect x="32" y="20" width="4" height="8" fill="url(#backpackGrad)" stroke="#444441" stroke-width="0.5"/>
  <rect x="40" y="20" width="4" height="8" fill="url(#backpackGrad)" stroke="#444441" stroke-width="0.5"/>
  <!-- Preparation gear -->
  <circle cx="35" cy="25" r="3" fill="url(#gearGrad)" stroke="#8A5A2B" stroke-width="0.5"/>
  <circle cx="35" cy="25" r="1" fill="#444441"/>
  <rect x="38" y="30" width="6" height="4" fill="url(#gearGrad)" stroke="#8A5A2B" stroke-width="0.5" rx="1"/>
  <!-- Readiness indicator -->
  <path d="M48 25 L52 25 L48 28" stroke="#639922" stroke-width="2" fill="#639922" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M45 30 L49 30 L45 33" stroke="#639922" stroke-width="2" fill="#639922" stroke-linecap="round" stroke-linejoin="round"/>
</svg>