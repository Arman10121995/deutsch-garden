<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="personGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E24B4A"/>
      <stop offset="100%" style="stop-color:#888780"/>
    </linearGradient>
    <linearGradient id="standGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8A5A2B"/>
      <stop offset="100%" style="stop-color:#444441"/>
    </linearGradient>
  </defs>
  <!-- Person representing -->
  <circle cx="20" cy="40" r="12" fill="url(#personGrad)" stroke="#444441" stroke-width="1"/>
  <circle cx="17" cy="36" r="2" fill="#444441"/>
  <circle cx="23" cy="36" r="2" fill="#444441"/>
  <path d="M17 44 Q20 46 23 44" stroke="#444441" stroke-width="1.5" fill="none"/>
  <!-- Flag/symbol of representation -->
  <rect x="45" y="15" width="12" height="8" fill="url(#flagGrad)" stroke="#444441" stroke-width="0.5"/>
  <path d="M45 15 L45 23" stroke="url(#standGrad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Representation connection -->
  <path d="M30 35 L42 25" stroke="#639922" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="42,25 39,23 39,27" fill="#639922"/>
  <!-- Speech bubble for representation -->
  <path d="M28 20 Q32 15 40 20 Q45 25 40 30 Q35 30 32 28 L28 25" fill="#FAC775" stroke="#8A5A2B" stroke-width="1" opacity="0.8"/>
  <!-- People being represented -->
  <circle cx="55" cy="50" r="5" fill="#444441" stroke="#444441" stroke-width="0.5"/>
  <circle cx="52" cy="48" r="1" fill="#FAC775"/>
  <circle cx="58" cy="48" r="1" fill="#FAC775"/>
</svg>