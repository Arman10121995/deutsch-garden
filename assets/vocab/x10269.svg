<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="personGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="toolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8A5A2B"/>
      <stop offset="100%" style="stop-color:#444441"/>
    </linearGradient>
  </defs>
  <!-- Person carrying out -->
  <circle cx="20" cy="30" r="12" fill="url(#personGrad)" stroke="#444441" stroke-width="1"/>
  <circle cx="17" cy="26" r="2" fill="#444441"/>
  <circle cx="23" cy="26" r="2" fill="#444441"/>
  <path d="M17 34 Q20 36 23 34" stroke="#444441" stroke-width="1.5" fill="none"/>
  <!-- Tools for carrying out work -->
  <rect x="40" y="20" width="12" height="8" fill="url(#toolGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
  <rect x="42" y="15" width="4" height="15" fill="url(#toolGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
  <circle cx="50" cy="30" r="4" fill="url(#toolGrad)" stroke="#444441" stroke-width="0.5"/>
  <!-- Action lines -->
  <path d="M28 25 L38 25" stroke="#EF9F27" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M28 30 L38 30" stroke="#EF9F27" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M28 35 L38 35" stroke="#EF9F27" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Execution arrow -->
  <path d="M38 28 L45 25" stroke="#639922" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="45,25 42,23 42,27" fill="#639922"/>
</svg>