<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="emphasisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
  </defs>
  <!-- Large star for emphasis -->
  <path d="M25 10 L30 20 L40 20 L32 28 L35 40 L25 32 L20 20 L30 20 Z" fill="url(#starGrad)" stroke="#444441" stroke-width="1"/>
  <!-- Emphasis circles -->
  <circle cx="30" cy="25" r="4" fill="url(#emphasisGrad)" stroke="#444441" stroke-width="0.5"/>
  <circle cx="30" cy="25" r="2" fill="#EF9F27" stroke="#444441" stroke-width="0.5"/>
  <!-- Highlight beams -->
  <path d="M30 10 L25 15" stroke="url(#highlightGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M30 10 L35 15" stroke="url(#highlightGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M40 25 L45 20" stroke="url(#highlightGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M20 25 L15 20" stroke="url(#highlightGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Additional emphasis marks -->
  <circle cx="20" cy="35" r="3" fill="url(#emphasisGrad)" stroke="#444441" stroke-width="0.5"/>
  <circle cx="40" cy="35" r="3" fill="url(#emphasisGrad)" stroke="#444441" stroke-width="0.5"/>
  <!-- Exclamation for emphasis -->
  <path d="M50 50 L50 45" stroke="url(#emphasisGrad)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="43" r="1.5" fill="url(#emphasisGrad)"/>
</svg>