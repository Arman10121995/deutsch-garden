<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="personGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="medalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="proudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
  </defs>
  <!-- Person feeling proud -->
  <circle cx="25" cy="35" r="10" fill="url(#personGrad)" stroke="#444441" stroke-width="1"/>
  <circle cx="22" cy="32" r="1.5" fill="#444441"/>
  <circle cx="28" cy="32" r="1.5" fill="#444441"/>
  <path d="M22 38 Q25 40 28 38" stroke="#444441" stroke-width="1" fill="none"/>
  <!-- Medal -->
  <circle cx="45" cy="25" r="8" fill="url(#medalGrad)" stroke="#444441" stroke-width="1"/>
  <circle cx="45" cy="25" r="5" fill="url(#proudGrad)" stroke="#444441" stroke-width="0.5"/>
  <!-- Medal ribbon -->
  <rect x="42" y="15" width="6" height="10" fill="url(#proudGrad)" stroke="#444441" stroke-width="0.5"/>
  <!-- Proud expression -->
