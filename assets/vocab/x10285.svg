<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="personGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="supportGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
  </defs>
  <!-- Person being relied on -->
  <circle cx="45" cy="35" r="12" fill="url(#personGrad)" stroke="#444441" stroke-width="1"/>
  <circle cx="42" cy="31" r="2" fill="#444441"/>
  <circle cx="48" cy="31" r="2" fill="#444441"/>
  <path d="M42 39 Q45 41 48 39" stroke="#444441" stroke-width="1.5" fill="none"/>
  <!-- Supporting hand -->
  <path d="M10 45 Q13 40 17 43 Q21 46 23 40 Q25 34 28 37 Q31 40 33 34 Q35 28 38 31 Q40 25 43 28 Q45 31 44 35 Q43 39 40 42 Q37 45 35 42 Q33 39 30 42 Q27 45 25 42 Z" fill="url(#handGrad)" stroke="#8A5A2B" stroke-width="1"/>
  <!-- Support beam -->
  <path d="M38 25 L42 30" stroke="url(#supportGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Reliance indicator -->
  <path d="M25 25 L30 20 L35 25" stroke="#639922" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Trust symbol -->
  <path d="M30 15 L32 18 L35 15 L32 12 L30 15" fill="#EF9F27" stroke="#444441" stroke-width="0.5"/>
  <!-- Connection line -->
  <path d="M35 30 L40 30" stroke="#EF9F27" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>