<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="formGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
  </defs>
  <!-- Form being filled -->
  <rect x="25" y="20" width="30" height="35" fill="url(#formGrad)" stroke="#8A5A2B" stroke-width="1" rx="2"/>
  <line x1="28" y1="25" x2="55" y2="25" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="28" y1="30" x2="55" y2="30" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="28" y1="35" x2="55" y2="35" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="28" y1="40" x2="55" y2="40" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="28" y1="45" x2="55" y2="45" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="28" y1="50" x2="55" y2="50" stroke="#8A5A2B" stroke-width="0.5"/>
  <!-- Pen filling out form -->
  <path d="M20 15 Q22 12 25 15 Q28 18 25 20" fill="url(#penGrad)" stroke="#444441" stroke-width="0.5"/>
  <path d="M25 15 L35 20" stroke="#444441" stroke-width="1" fill="none"/>
