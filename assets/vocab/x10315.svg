<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="diceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="probabilityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E24B4A"/>
      <stop offset="100%" style="stop-color:#888780"/>
    </linearGradient>
    <linearGradient id="lowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8A5A2B"/>
      <stop offset="100%" style="stop-color:#444441"/>
    </linearGradient>
  </defs>
  <!-- Probability dice with low probability -->
  <rect x="25" y="25" width="14" height="14" fill="url(#diceGrad)" stroke="#444441" stroke-width="1" rx="2"/>
  <!-- Dice dots for low probability (only 1-2 dots) -->
  <circle cx="34" cy="34" r="1.5" fill="#444441"/>
  <circle cx="28" cy="28" r="1.5" fill="#444441"/>
  <!-- Probability indicator (downward) -->
  <path d="M40 40 L45 45 L50 40" fill="url(#probabilityGrad)" stroke="#444441" stroke-width="0.5"/>
  <path d="M40 40 L40 35" stroke="url(#probabilityGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M50 40 L50 35" stroke="url(#probabilityGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Unlikely percentage -->
  <circle cx="32" cy="50" r="4" fill="url(#lowGrad)" stroke="#444441" stroke-width="0.5"/>
  <path d="M30 50 L34 50" stroke="#444441" stroke-width="1" stroke-linecap="round"/>
  <!-- Doubt question marks -->
  <path d="M15 15 Q17 12 19 15 Q17 18 15 15" stroke="url(#probabilityGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="17" cy="18" r="0.5" fill="url(#probabilityGrad)"/>
</svg>