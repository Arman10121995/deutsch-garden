  <!-- Hand showing the other side -->
  <path d="M25 50 Q28 45 32 48 Q36 51 38 45 Q40 39 43 42 Q46 45 48 40 Q50 35 53 38 Q55 31 54 35 Q53 39 50 42 Q47 45 45 42 Q43 39 40 42 Z" fill="url(#handGrad)" stroke="#8A5A2B" stroke-width="1"/>
