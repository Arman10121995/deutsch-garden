<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="personGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E24B4A"/>
      <stop offset="100%" style="stop-color:#888780"/>
    </linearGradient>
    <linearGradient id="warningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="signGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E24B4A"/>
      <stop offset="100%" style="stop-color:#888780"/>
    </linearGradient>
  </defs>
  <!-- Person warning -->
  <circle cx="20" cy="40" r="12" fill="url(#personGrad)" stroke="#444441" stroke-width="1"/>
  <circle cx="17" cy="36" r="2" fill="#444441"/>
  <circle cx="23" cy="36" r="2" fill="#444441"/>
  <path d="M17 44 Q20 46 23 44" stroke="#444441" stroke-width="1.5" fill="none"/>
  <!-- Warning sign -->
  <path d="M45 15 L55 15 L55 25 L45 25 L45 15" fill="url(#warningGrad)" stroke="url(#signGrad)" stroke-width="1"/>
  <polygon points="45,15 50,10 55,15" fill="url(#warningGrad)" stroke="url(#signGrad)" stroke-width="0.5"/>
  <path d="M50 20 L50 15" stroke="url(#signGrad)" stroke-width="1" stroke-linecap="round"/>
  <path d="M48 18 L52 18" stroke="url(#signGrad)" stroke-width="1" stroke-linecap="round"/>
  <!-- Exclamation mark -->
  <circle cx="50" cy="28" r="3" fill="#E24B4A" stroke="#444441" stroke-width="0.5"/>
  <rect x="49" y="31" width="2" height="8" fill="#E24B4A" stroke="#444441" stroke-width="0.5"/>
  <!-- Warning connection -->
  <path d="M28 35 L40 25" stroke="#EF9F27" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="40,25 37,23 37,27" fill="#EF9F27"/>
  <!-- Urgency lines -->
  <path d="M40 20 L45 15" stroke="#E24B4A" stroke-width="1" stroke-linecap="round"/>
  <path d="M50 20 L55 15" stroke="#E24B4A" stroke-width="1" stroke-linecap="round"/>
</svg>