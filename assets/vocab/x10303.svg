<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="regionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8A5A2B"/>
      <stop offset="100%" style="stop-color:#444441"/>
    </linearGradient>
  </defs>
  <!-- Map background -->
  <rect x="10" y="10" width="44" height="44" fill="url(#mapGrad)" stroke="#444441" stroke-width="1" rx="2"/>
  <!-- Regional area -->
  <path d="M20 20 Q25 15 35 20 Q40 25 45 20 Q45 30 40 35 Q35 40 25 35 Q20 30 20 20" fill="url(#regionGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <!-- Region boundary -->
  <path d="M20 20 Q25 15 35 20 Q40 25 45 20 Q45 30 40 35 Q35 40 25 35 Q20 30 20 20" fill="none" stroke="#444441" stroke-width="1" stroke-dasharray="2,1"/>
  <!-- Location pin -->
  <circle cx="32" cy="28" r="4" fill="#E24B4A" stroke="#444441" stroke-width="0.5"/>
  <path d="M32 24 L32 18 L34 20 L32 18 L30 20 L32 18" fill="#E24B4A" stroke="#444441" stroke-width="0.5"/>
  <!-- Map grid lines -->
  <path d="M15 20 L50 20" stroke="url(#borderGrad)" stroke-width="0.5"/>
  <path d="M15 30 L50 30" stroke="url(#borderGrad)" stroke-width="0.5"/>
  <path d="M25 10 L25 45" stroke="url(#borderGrad)" stroke-width="0.5"/>
  <path d="M35 10 L35 45" stroke="url(#borderGrad)" stroke-width="0.5"/>
  <!-- Region label -->
  <rect x="28" y="35" width="8" height="4" fill="url(#regionGrad)" stroke="url(#borderGrad)" stroke-width="0.5" rx="1"/>
</svg>