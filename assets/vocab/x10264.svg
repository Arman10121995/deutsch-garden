<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="stampGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF9F27"/>
      <stop offset="100%" style="stop-color:#E24B4A"/>
    </linearGradient>
  </defs>
  <!-- Document -->
  <rect x="15" y="20" width="34" height="30" fill="url(#docGrad)" stroke="#8A5A2B" stroke-width="1" rx="2"/>
  <line x1="18" y1="25" x2="49" y2="25" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="18" y1="30" x2="49" y2="30" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="18" y1="35" x2="49" y2="35" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="18" y1="40" x2="49" y2="40" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="18" y1="45" x2="49" y2="45" stroke="#8A5A2B" stroke-width="0.5"/>
  <!-- Confirmation stamp -->
  <circle cx="40" cy="35" r="8" fill="url(#stampGrad)" stroke="#8A5A2B" stroke-width="1"/>
  <circle cx="40" cy="35" r="6" fill="none" stroke="#8A5A2B" stroke-width="1"/>
  <!-- Checkmark in stamp -->
  <path d="M36 31 L40 35 L44 31" stroke="#444441" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Approved text lines -->
  <path d="M34 28 L34 26" stroke="#444441" stroke-width="1"/>
  <path d="M36 28 L36 26" stroke="#444441" stroke-width="1"/>
  <path d="M38 28 L38 26" stroke="#444441" stroke-width="1"/>
  <path d="M40 28 L40 26" stroke="#444441" stroke-width="1"/>
  <path d="M42 28 L42 26" stroke="#444441" stroke-width="1"/>
  <!-- Verification lines -->
  <path d="M20 50 L25 50" stroke="#639922" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M30 50 L35 50" stroke="#639922" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M40 50 L45 50" stroke="#639922" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>