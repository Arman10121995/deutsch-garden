<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
    <linearGradient id="availableGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
  </defs>
  <!-- Open available box -->
  <rect x="20" y="25" width="24" height="20" fill="url(#boxGrad)" stroke="#8A5A2B" stroke-width="1" rx="2"/>
  <rect x="22" y="27" width="20" height="16" fill="none" stroke="#8A5A2B" stroke-width="0.5"/>
  <!-- Available checkmark -->
  <path d="M30 35 L35 40 L42 33" stroke="url(#checkGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Items inside box -->
  <circle cx="28" cy="32" r="3" fill="url(#availableGrad)" stroke="#444441" stroke-width="0.5"/>
  <rect x="35" y="30" width="6" height="4" fill="url(#availableGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
  <path d="M45 35 L47 33 L50 35 L47 37 L45 35" fill="url(#availableGrad)" stroke="#444441" stroke-width="0.5"/>
  <!-- Open lid -->
  <path d="M20 25 L22 23 L46 23 L48 25" fill="url(#boxGrad)" stroke="#8A5A2B" stroke-width="0.5"/>
  <!-- Availability rays -->
  <path d="M30 15 L35 10" stroke="#639922" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M40 15 L45 10" stroke="#639922" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M35 10 L40 5" stroke="#639922" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>