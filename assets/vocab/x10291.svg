<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="personGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="speechGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
  </defs>
  <!-- Person convincing -->
  <circle cx="20" cy="40" r="12" fill="url(#personGrad)" stroke="#444441" stroke-width="1"/>
  <circle cx="17" cy="36" r="2" fill="#444441"/>
  <circle cx="23" cy="36" r="2" fill="#444441"/>
  <path d="M17 44 Q20 46 23 44" stroke="#444441" stroke-width="1.5" fill="none"/>
  <!-- Speech bubbles for persuasion -->
  <path d="M35 15 Q40 10 50 15 Q55 20 50 25 Q45 20 40 25 L35 20" fill="url(#speechGrad)" stroke="#8A5A2B" stroke-width="1"/>
  <path d="M30 30 Q35 25 45 30 Q50 35 45 40 Q40 35 35 40 L30 35" fill="url(#speechGrad)" stroke="#8A5A2B" stroke-width="1"/>
  <!-- Persuasion checkmarks -->
  <path d="M40 20 L44 24 L48 20" stroke="url(#checkGrad)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M35 30 L39 34 L43 30" stroke="url(#checkGrad)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Convincing hand gesture -->
  <path d="M25 25 Q28 20 32 25 Q35 20 38 25" stroke="url(#checkGrad)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Person being convinced -->
  <circle cx="55" cy="50" r="8" fill="#444441" stroke="#444441" stroke-width="0.5"/>
  <circle cx="52" cy="47" r="1" fill="#FAC775"/>
  <circle cx="58" cy="47" r="1" fill="#FAC775"/>
</svg>