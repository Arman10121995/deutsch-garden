<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="personGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="groupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
  </defs>
  <!-- Person joining -->
  <circle cx="15" cy="25" r="10" fill="url(#personGrad)" stroke="#444441" stroke-width="1"/>
  <circle cx="12" cy="22" r="2" fill="#444441"/>
  <circle cx="18" cy="22" r="2" fill="#444441"/>
  <path d="M12 28 Q15 30 18 28" stroke="#444441" stroke-width="1.5" fill="none"/>
  <!-- Group/circle to join -->
  <circle cx="45" cy="35" r="15" fill="url(#groupGrad)" stroke="#8A5A2B" stroke-width="1"/>
  <!-- Other people in group -->
  <circle cx="42" cy="32" r="3" fill="#444441"/>
  <circle cx="48" cy="32" r="3" fill="#444441"/>
  <circle cx="45" cy="38" r="3" fill="#444441"/>
  <!-- Join arrow -->
  <path d="M22 25 L35 30" stroke="#639922" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="35,30 32,28 32,32" fill="#639922"/>
</svg>