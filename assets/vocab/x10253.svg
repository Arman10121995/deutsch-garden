<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="shrinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E24B4A"/>
      <stop offset="100%" style="stop-color:#888780"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
  </defs>
  <!-- Shrinking arrow pointing left -->
  <path d="M50 30 L40 30 L43 27 M40 30 L43 33" stroke="url(#shrinkGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M35 30 L25 30 L28 27 M25 30 L28 33" stroke="url(#shrinkGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M20 30 L10 30 L13 27 M10 30 L13 33" stroke="url(#shrinkGrad)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Down arrow for reduction -->
  <path d="M58 40 L58 45 L61 45 L58 48 L55 45 L58 45 L58 40" stroke="#E24B4A" stroke-width="1.5" fill="#E24B4A" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bars showing reduction -->
  <rect x="12" y="30" width="4" height="30" fill="url(#barGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
  <rect x="22" y="35" width="4" height="25" fill="url(#barGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
  <rect x="32" y="40" width="4" height="20" fill="url(#barGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
  <rect x="42" y="45" width="4" height="15" fill="url(#barGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
  <rect x="52" y="50" width="4" height="10" fill="url(#barGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
</svg>