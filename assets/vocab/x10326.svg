<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="actionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="meanwhileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
  </defs>
  <!-- Clock face -->
  <circle cx="32" cy="32" r="15" fill="url(#clockGrad)" stroke="#444441" stroke-width="1"/>
  <circle cx="32" cy="32" r="1" fill="#444441"/>
  <path d="M32 32 L32 18 L31 20" stroke="#444441" stroke-width="2" stroke-linecap="round"/>
  <path d="M32 32 L38 36 L36 34" stroke="#444441" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Simultaneous actions -->
  <circle cx="15" cy="15" r="6" fill="url(#actionGrad)" stroke="#444441" stroke-width="0.5"/>
  <rect x="45" y="45" width="8" height="8" fill="url(#actionGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
  <!-- Meanwhile connection -->
  <path d="M28 20 L40 30 L45 25" stroke="url(#meanwhileGrad)" stroke-width="1" fill="none" stroke-dasharray="2,1"/>
</svg>