<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="personGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="focusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <radialGradient id="targetGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#444441"/>
    </radialGradient>
  </defs>
  <!-- Person concentrating -->
  <circle cx="20" cy="35" r="12" fill="url(#personGrad)" stroke="#444441" stroke-width="1"/>
  <circle cx="17" cy="31" r="2" fill="#444441"/>
  <circle cx="23" cy="31" r="2" fill="#444441"/>
  <path d="M17 39 Q20 41 23 39" stroke="#444441" stroke-width="1.5" fill="none"/>
  <!-- Magnifying glass for focus -->
  <circle cx="45" cy="25" r="10" fill="url(#focusGrad)" stroke="#8A5A2B" stroke-width="1"/>
  <circle cx="45" cy="25" r="6" fill="none" stroke="#8A5A2B" stroke-width="1"/>
  <path d="M52 25 L58 25" stroke="#8A5A2B" stroke-width="2" stroke-linecap="round"/>
  <!-- Focus lines to person -->
  <path d="M35 25 L28 30" stroke="#EF9F27" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M35 25 L28 35" stroke="#EF9F27" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Target of concentration -->
  <circle cx="45" cy="25" r="4" fill="url(#targetGrad)" stroke="#444441" stroke-width="0.5"/>
  <circle cx="45" cy="25" r="2" fill="#EF9F27" stroke="#444441" stroke-width="0.5"/>
</svg>