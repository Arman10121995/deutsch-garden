<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="finishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8A5A2B"/>
      <stop offset="100%" style="stop-color:#444441"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
  </defs>
  <!-- Finish line -->
  <path d="M20 55 L45 55" stroke="url(#finishGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M20 50 L45 50" stroke="url(#finishGrad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Finally checkmark -->
  <path d="M30 20 L35 25 L45 15" stroke="url(#checkGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Race/path to finish -->
  <path d="M15 45 L20 40 L25 45 L30 40 L35 45 L40 40 L45 45" stroke="url(#lineGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>