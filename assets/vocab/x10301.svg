<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="moneyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="graphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8A5A2B"/>
      <stop offset="100%" style="stop-color:#444441"/>
    </linearGradient>
  </defs>
  <!-- Economic growth graph -->
  <path d="M10 50 L15 45 L20 40 L25 35 L30 30 L35 25 L40 20 L45 15 L50 12 L55 10" stroke="url(#graphGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Money coins -->
  <circle cx="20" cy="20" r="5" fill="url(#moneyGrad)" stroke="url(#coinGrad)" stroke-width="1"/>
  <circle cx="35" cy="25" r="4" fill="url(#moneyGrad)" stroke="url(#coinGrad)" stroke-width="0.5"/>
  <circle cx="45" cy="15" r="3" fill="url(#moneyGrad)" stroke="url(#coinGrad)" stroke-width="0.5"/>
  <!-- Coin details -->
  <circle cx="20" cy="20" r="1" fill="url(#coinGrad)"/>
  <circle cx="35" cy="25" r="0.8" fill="url(#coinGrad)"/>
  <circle cx="45" cy="15" r="0.5" fill="url(#coinGrad)"/>
  <!-- Economic bars -->
  <rect x="15" y="45" width="4" height="10" fill="url(#moneyGrad)" stroke="#8A5A2B" stroke-width="0.5" rx="1"/>
  <rect x="22" y="40" width="4" height="15" fill="url(#moneyGrad)" stroke="#8A5A2B" stroke-width="0.5" rx="1"/>
  <rect x="29" y="35" width="4" height="20" fill="url(#moneyGrad)" stroke="#8A5A2B" stroke-width="0.5" rx="1"/>
  <rect x="36" y="30" width="4" height="25" fill="url(#moneyGrad)" stroke="#8A5A2B" stroke-width="0.5" rx="1"/>
  <!-- Growth indicator -->
  <path d="M58 20 L58 15 L61 15 L58 12 L55 15 L58 15 L58 20" fill="#639922" stroke="#444441" stroke-width="0.5"/>
</svg>