  <rect x="42" y="15" width="4" height="12" fill="url(#screenGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
  <circle cx="48" cy="30" r="3" fill="url(#screenGrad)" stroke="#444441" stroke-width="0.5"/>
  <!-- Information flow -->
  <path d="M30 30 L38 25" stroke="url(#infoGrad)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="38,25 35,23 35,27" fill="url(#infoGrad)"/>
  <!-- Documents with information -->
  <rect x="45" y="40" width="8" height="10" fill="url(#infoGrad)" stroke="#8A5A2B" stroke-width="0.5" rx="1"/>
  <line x1="47" y1="42" x2="53" y2="42" stroke="#8A5A2B" stroke-width="0.3"/>
  <line x1="47" y1="45" x2="53" y2="45" stroke="#8A5A2B" stroke-width="0.3"/>
