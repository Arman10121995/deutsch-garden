<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="descendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#E24B4A"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
  </defs>
  <!-- Descending arrow -->
  <path d="M30 10 L30 25 L27 22 M30 25 L33 22" stroke="url(#descendGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30 25 L30 40 L27 37 M30 40 L33 37" stroke="url(#descendGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30 40 L30 55 L27 52 M30 55 L33 52" stroke="url(#descendGrad)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Down arrow for lowering -->
  <path d="M58 40 L58 45 L61 45 L58 48 L55 45 L58 45 L58 40" stroke="#E24B4A" stroke-width="1.5" fill="#E24B4A" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bars showing decrease -->
  <rect x="12" y="10" width="4" height="40" fill="url(#barGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
  <rect x="22" y="15" width="4" height="35" fill="url(#barGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
  <rect x="32" y="20" width="4" height="30" fill="url(#barGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
  <rect x="42" y="25" width="4" height="25" fill="url(#barGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
  <rect x="52" y="30" width="4" height="20" fill="url(#barGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
</svg>