<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="exampleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="focusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
  </defs>
  <!-- Pointing hand -->
  <path d="M10 40 Q13 35 17 38 Q21 41 23 35 Q25 29 28 32 Q31 35 33 29 Q35 23 38 26 Q40 20 43 23 Q45 26 44 30 Q43 34 40 37 Q37 40 35 37 Q33 34 30 37 Z" fill="url(#handGrad)" stroke="#8A5A2B" stroke-width="1"/>
  <!-- Finger pointing -->
  <path d="M38 26 L50 20" stroke="#8A5A2B" stroke-width="2" stroke-linecap="round"/>
  <!-- Example item -->
  <circle cx="55" cy="25" r="8" fill="url(#exampleGrad)" stroke="#444441" stroke-width="0.5"/>
  <!-- Focus on example -->
  <circle cx="55" cy="25" r="4" fill="url(#focusGrad)" stroke="#444441" stroke-width="0.5" opacity="0.5"/>
