<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
    <linearGradient id="timeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
  </defs>
  <!-- Clock face -->
  <circle cx="32" cy="32" r="20" fill="url(#clockGrad)" stroke="#444441" stroke-width="1"/>
  <circle cx="32" cy="32" r="1" fill="#444441"/>
  <!-- Clock hands showing time passing -->
  <path d="M32 32 L32 15 L31 17" stroke="#444441" stroke-width="2" stroke-linecap="round"/>
  <path d="M32 32 L42 27 L40 29" stroke="#444441" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Progress indicators -->
  <circle cx="15" cy="15" r="4" fill="url(#progressGrad)" stroke="#444441" stroke-width="0.5"/>
  <rect x="45" y="45" width="8" height="4" fill="url(#progressGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
  <!-- Time flow -->
  <path d="M32 10 Q35 15 32 20 Q29 15 32 10" fill="url(#timeGrad)" stroke="#444441" stroke-width="0.5" opacity="0.5"/>
</svg>