<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="calendarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="recurringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
    <linearGradient id="regularGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
  </defs>
  <!-- Calendar -->
  <rect x="10" y="10" width="44" height="40" fill="url(#calendarGrad)" stroke="#8A5A2B" stroke-width="1" rx="2"/>
  <!-- Calendar grid -->
  <line x1="15" y1="15" x2="54" y2="15" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="15" y1="25" x2="54" y2="25" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="15" y1="35" x2="54" y2="35" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="15" y1="45" x2="54" y2="45" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="25" y1="10" x2="25" y2="50" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="35" y1="10" x2="35" y2="50" stroke="#8A5A2B" stroke-width="0.5"/>
  <line x1="45" y1="10" x2="45" y2="50" stroke="#8A5A2B" stroke-width="0.5"/>
  <!-- Regularly marked days -->
  <circle cx="20" cy="20" r="3" fill="url(#recurringGrad)" stroke="#444441" stroke-width="0.5"/>
  <circle cx="30" cy="20" r="3" fill="url(#recurringGrad)" stroke="#444441" stroke-width="0.5"/>
  <circle cx="40" cy="20" r="3" fill="url(#recurringGrad)" stroke="#444441" stroke-width="0.5"/>
  <circle cx="50" cy="20" r="3" fill="url(#recurringGrad)" stroke="#444441" stroke-width="0.5"/>
  <!-- Regular pattern -->
  <path d="M15 25 L20 25" stroke="url(#regularGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M25 25 L30 25" stroke="url(#regularGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M35 25 L40 25" stroke="url(#regularGrad)" stroke-width="1.5" stroke-linecap="round"/>
</svg>