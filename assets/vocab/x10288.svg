<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="personGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="infoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
  </defs>
  <!-- Person informing -->
  <circle cx="20" cy="40" r="12" fill="url(#personGrad)" stroke="#444441" stroke-width="1"/>
  <circle cx="17" cy="36" r="2" fill="#444441"/>
  <circle cx="23" cy="36" r="2" fill="#444441"/>
  <path d="M17 44 Q20 46 23 44" stroke="#444441" stroke-width="1.5" fill="none"/>
  <!-- Large speech bubble for communication -->
  <path d="M35 15 Q40 10 50 15 Q55 20 50 25 Q55 30 50 35 Q45 40 40 40 Q40 45 35 45 Q30 45 30 35 L35 30" fill="url(#bubbleGrad)" stroke="#8A5A2B" stroke-width="1"/>
  <!-- Information symbols in bubble -->
  <circle cx="40" cy="25" r="3" fill="url(#infoGrad)" stroke="#444441" stroke-width="0.5"/>
  <path d="M38 25 L40 27 L42 25" stroke="#444441" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 23 L40 21" stroke="#444441" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- Lines in bubble for text -->
  <path d="M38 30 L50 30" stroke="#8A5A2B" stroke-width="0.5"/>
  <path d="M38 33 L50 33" stroke="#8A5A2B" stroke-width="0.5"/>
  <path d="M38 36 L50 36" stroke="#8A5A2B" stroke-width="0.5"/>
  <!-- Communication arrow -->
  <path d="M28 35 L35 30" stroke="#EF9F27" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="35,30 32,28 32,32" fill="#EF9F27"/>
</svg>