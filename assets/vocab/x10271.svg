<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="personGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="personGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="transferGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
  </defs>
  <!-- Person taking over (receiver) -->
  <circle cx="45" cy="35" r="12" fill="url(#personGrad1)" stroke="#444441" stroke-width="1"/>
  <circle cx="42" cy="31" r="2" fill="#444441"/>
  <circle cx="48" cy="31" r="2" fill="#444441"/>
  <path d="M42 39 Q45 41 48 39" stroke="#444441" stroke-width="1.5" fill="none"/>
  <!-- Person giving over (giver) -->
  <circle cx="15" cy="25" r="10" fill="url(#personGrad2)" stroke="#444441" stroke-width="1"/>
  <circle cx="12" cy="22" r="1.5" fill="#444441"/>
  <circle cx="18" cy="22" r="1.5" fill="#444441"/>
  <path d="M12 28 Q15 30 18 28" stroke="#444441" stroke-width="1" fill="none"/>
  <!-- Transfer arrow -->
  <path d="M22 28 L38 32" stroke="url(#transferGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <polygon points="38,32 35,30 35,34" fill="url(#transferGrad)"/>
  <!-- Handing over object -->
  <rect x="25" y="25" width="15" height="10" fill="url(#transferGrad)" stroke="#8A5A2B" stroke-width="1" rx="1"/>
</svg>