<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="sideGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="sideGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
  </defs>
  <!-- Hand showing one side -->
  <path d="M10 45 Q13 40 17 43 Q21 46 23 40 Q25 34 28 37 Q31 40 33 34 Q35 28 38 31 Q40 25 43 28 Q45 31 44 35 Q43 39 40 42 Q37 45 35 42 Q33 39 30 42 Z" fill="url(#handGrad)" stroke="#8A5A2B" stroke-width="1"/>
