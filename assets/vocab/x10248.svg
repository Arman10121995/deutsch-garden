<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8A5A2B"/>
      <stop offset="100%" style="stop-color:#444441"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
  </defs>
  <!-- Closed door being opened -->
  <rect x="15" y="15" width="34" height="44" fill="url(#doorGrad)" stroke="#444441" stroke-width="1" rx="2"/>
  <circle cx="55" cy="32" r="3" fill="#444441"/>
  <!-- Key unlocking -->
  <path d="M25 30 Q28 25 32 30 Q35 25 38 30" stroke="#FAC775" stroke-width="2" fill="none"/>
  <circle cx="32" cy="30" r="2.5" fill="url(#keyGrad)" stroke="#8A5A2B" stroke-width="0.5"/>
  <rect x="30" y="30" width="4" height="12" fill="#FAC775" stroke="#8A5A2B" stroke-width="0.5" rx="1"/>
  <!-- Opening path arrow -->
  <path d="M45 20 L55 30 L45 40" stroke="#639922" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="55,30 52,28 52,32" fill="#639922"/>
</svg>