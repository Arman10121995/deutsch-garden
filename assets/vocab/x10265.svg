<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8A5A2B"/>
      <stop offset="100%" style="stop-color:#444441"/>
    </linearGradient>
    <linearGradient id="extendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
  </defs>
  <!-- Original line -->
  <line x1="10" y1="32" x2="40" y2="32" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Extension arrow -->
  <path d="M40 32 L55 32 L52 29 M55 32 L52 35" stroke="url(#extendGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Extension indicator -->
  <path d="M35 25 L40 30 L45 25" stroke="#EF9F27" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Length markers -->
  <path d="M15 28 L15 36" stroke="#888780" stroke-width="1" stroke-linecap="round"/>
  <path d="M25 28 L25 36" stroke="#888780" stroke-width="1" stroke-linecap="round"/>
  <path d="M35 28 L35 36" stroke="#888780" stroke-width="1" stroke-linecap="round"/>
  <path d="M45 28 L45 36" stroke="#888780" stroke-width="1" stroke-linecap="round"/>
  <path d="M55 28 L55 36" stroke="#888780" stroke-width="1" stroke-linecap="round"/>
  <!-- Plus signs for extension -->
  <path d="M47 25 L50 25 M49 23 L49 27" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M52 28 L55 28 M54 26 L54 30" stroke="#639922" stroke-width="1.5" stroke-linecap="round"/>
</svg>