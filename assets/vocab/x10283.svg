<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="personGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="pathGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="pathGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E24B4A"/>
      <stop offset="100%" style="stop-color:#888780"/>
    </linearGradient>
  </defs>
  <!-- Person deciding -->
  <circle cx="30" cy="50" r="12" fill="url(#personGrad)" stroke="#444441" stroke-width="1"/>
  <circle cx="27" cy="46" r="2" fill="#444441"/>
  <circle cx="33" cy="46" r="2" fill="#444441"/>
  <path d="M27 54 Q30 56 33 54" stroke="#444441" stroke-width="1.5" fill="none"/>
  <!-- Path options -->
  <path d="M10 15 Q25 25 40 15" stroke="url(#pathGrad1)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M10 25 Q25 15 40 25" stroke="url(#pathGrad2)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Decision point -->
  <circle cx="25" cy="20" r="6" fill="#EF9F27" stroke="#444441" stroke-width="1"/>
  <circle cx="25" cy="20" r="3" fill="#8A5A2B" stroke="#444441" stroke-width="0.5"/>
  <!-- Choice arrow -->
  <path d="M25 30 L25 45" stroke="#444441" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="25,45 22,42 28,42" fill="#444441"/>
  <!-- Selected path indicator -->
  <path d="M35 20 L40 25 L45 20" stroke="#639922" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>