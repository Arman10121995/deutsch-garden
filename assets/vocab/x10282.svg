<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="groupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="personGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="connectionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#639922"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
  </defs>
  <!-- Group container -->
  <circle cx="32" cy="32" r="25" fill="url(#groupGrad)" stroke="#8A5A2B" stroke-width="1"/>
  <!-- People in group -->
  <circle cx="20" cy="25" r="8" fill="url(#personGrad)" stroke="#444441" stroke-width="0.5"/>
  <circle cx="44" cy="20" r="6" fill="url(#personGrad)" stroke="#444441" stroke-width="0.5"/>
  <circle cx="25" cy="40" r="7" fill="url(#personGrad)" stroke="#444441" stroke-width="0.5"/>
  <circle cx="40" cy="45" r="6" fill="url(#personGrad)" stroke="#444441" stroke-width="0.5"/>
  <!-- Person outside joining -->
  <circle cx="10" cy="50" r="8" fill="url(#personGrad)" stroke="#444441" stroke-width="1"/>
  <circle cx="7" cy="47" r="1.5" fill="#444441"/>
  <circle cx="13" cy="47" r="1.5" fill="#444441"/>
  <!-- Connection line -->
  <path d="M16 45 L28 35" stroke="url(#connectionGrad)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="28,35 25,33 25,37" fill="url(#connectionGrad)"/>
  <!-- Belonging indicator -->
  <path d="M50 15 L52 18 L55 15 L52 12 L50 15" fill="#639922" stroke="#444441" stroke-width="0.5"/>
  <!-- Group boundary -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#8A5A2B" stroke-width="1" stroke-dasharray="3,1"/>
</svg>