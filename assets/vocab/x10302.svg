<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8A5A2B"/>
      <stop offset="100%" style="stop-color:#444441"/>
    </linearGradient>
    <linearGradient id="artGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAC775"/>
      <stop offset="100%" style="stop-color:#E8B08A"/>
    </linearGradient>
    <linearGradient id="stageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#85B7EB"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
  </defs>
  <!-- Museum building -->
  <rect x="10" y="20" width="44" height="30" fill="url(#buildingGrad)" stroke="#444441" stroke-width="1"/>
  <path d="M10 20 L32 10 L54 20" fill="url(#buildingGrad)" stroke="#444441" stroke-width="0.5"/>
  <rect x="15" y="25" width="4" height="4" fill="#888780"/>
  <rect x="22" y="25" width="4" height="4" fill="#888780"/>
  <rect x="29" y="25" width="4" height="4" fill="#888780"/>
  <rect x="36" y="25" width="4" height="4" fill="#888780"/>
  <rect x="43" y="25" width="4" height="4" fill="#888780"/>
  <!-- Theater stage -->
  <rect x="25" y="35" width="14" height="8" fill="url(#stageGrad)" stroke="#444441" stroke-width="0.5" rx="1"/>
  <!-- Art/paintings -->
  <rect x="12" y="28" width="8" height="6" fill="url(#artGrad)" stroke="#8A5A2B" stroke-width="0.5" rx="1"/>
  <rect x="44" y="28" width="8" height="6" fill="url(#artGrad)" stroke="#8A5A2B" stroke-width="0.5" rx="1"/>
  <!-- Spotlights -->
  <circle cx="20" cy="10" r="3" fill="#FAC775" stroke="#8A5A2B" stroke-width="0.5"/>
  <circle cx="44" cy="10" r="3" fill="#FAC775" stroke="#8A5A2B" stroke-width="0.5"/>
  <!-- Light beams -->
  <path d="M20 13 L20 25" stroke="#FAC775" stroke-width="1" stroke-linecap="round"/>
  <path d="M44 13 L44 25" stroke="#FAC775" stroke-width="1" stroke-linecap="round"/>
  <!-- Cultural symbols -->
  <path d="M25 50 Q30 45 35 50" fill="url(#artGrad)" stroke="#444441" stroke-width="0.5"/>
  <path d="M35 50 Q40 45 45 50" fill="url(#artGrad)" stroke="#444441" stroke-width="0.5"/>
</svg>