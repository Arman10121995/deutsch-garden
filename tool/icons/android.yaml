flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  # Android 8+ crops the icon to the launcher's mask, so the mark is supplied
  # on its own over a flat background rather than pre-composited.
  adaptive_icon_background: '#7C5CFC'
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
